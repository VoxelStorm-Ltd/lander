name: Build Linux

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux 64-bit (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            pkg-config \
            libboost-chrono-dev \
            libfreetype6-dev \
            libftgl-dev \
            libglew-dev \
            libglfw3-dev \
            libgl-dev \
            libglu1-mesa-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_32BIT=OFF

      - name: Build
        run: cmake --build build --parallel
